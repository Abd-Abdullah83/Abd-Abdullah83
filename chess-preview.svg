<svg width="800" height="420" viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
.cd{fill:#060c14}.cl{fill:#0c1a26}
.pw{font-size:26px;fill:#d0ecff;font-family:serif}
.pb{font-size:26px;fill:#cc2222;font-family:serif}
.lab{font-size:9.5px;fill:#3ab8d8;font-family:monospace}
.labg{font-size:9.5px;fill:#00dd66;font-family:monospace}
.labr{font-size:9.5px;fill:#dd3333;font-family:monospace}
.laby{font-size:9.5px;fill:#ffcc00;font-family:monospace}
.labd{font-size:8.5px;fill:#1a3a4a;font-family:monospace}
.ttl{font-size:13px;fill:#ffcc00;font-family:serif;font-weight:bold;letter-spacing:.15em}
.sub{font-size:9px;fill:#1e3a50;font-family:monospace;letter-spacing:.15em}
.qt{font-size:10.5px;fill:#ffcc00;font-family:serif;font-style:italic}
.stat-val{font-size:22px;fill:#00ccee;font-family:monospace;font-weight:bold}
.stat-lbl{font-size:8px;fill:#1a3a4a;font-family:monospace;letter-spacing:.15em;text-transform:uppercase}
</style>

<!-- BOARD cells reusable -->
<rect id="cd" width="34" height="34" class="cd"/>
<rect id="cl" width="34" height="34" class="cl"/>
</defs>

<!-- ── BACKGROUND ── -->
<rect width="800" height="420" fill="#04060a" rx="12"/>
<!-- chess tile pattern -->
<rect width="800" height="420" rx="12" fill="url(#tp)" opacity=".4"/>
<pattern id="tp" x="0" y="0" width="68" height="68" patternUnits="userSpaceOnUse">
  <rect width="34" height="34" fill="rgba(0,180,220,.018)"/>
  <rect x="34" y="34" width="34" height="34" fill="rgba(0,180,220,.018)"/>
</pattern>

<!-- ── BORDER GLOW ── -->
<rect x="1" y="1" width="798" height="418" rx="12" fill="none" stroke="rgba(0,200,238,.12)" stroke-width="1"/>
<rect x="3" y="3" width="794" height="414" rx="11" fill="none" stroke="rgba(255,204,0,.06)" stroke-width="1"/>

<!-- ══════════════════════════════════════
     BOARD at x=14, y=14, cell=34px, 8x8
     col x = 14 + col*34 + 17 (center)
     row y = 14 + row*34 + 22 (center)
     a8=col0r0: cx=31, cy=36
     g8=col6r0: cx=235, cy=36
     f7=col5r1: cx=201, cy=70
     g7=col6r1: cx=235, cy=70
     g6=col6r2: cx=235, cy=104
     g5=col6r3: cx=235, cy=138
