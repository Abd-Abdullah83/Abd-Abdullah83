     h6=col7r2: cx=269, cy=104
     h7=col7r1: cx=269, cy=70
     f8=col5r0: cx=201, cy=36
     d8=col3r0: cx=133, cy=36
     e7=col4r1: cx=167, cy=70
     d6=col3r2: cx=133, cy=104
     e1=col4r7: cx=167, cy=274
══════════════════════════════════════ -->

